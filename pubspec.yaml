name: fourjave
description: 4jave - VPN/proxy client for Windows and Android
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  yaml: ^3.1.2
  web_socket_channel: ^3.0.1
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
